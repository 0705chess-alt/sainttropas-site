<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Shooter - Stable Build</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; background: #111; }
        /* 캔버스가 눈에 보이도록 테두리와 기본 배경색 강제 지정 */
        canvas { display: block; background: #161616; width: 100%; height: 100%; border: 1px solid #333; }

        /* UI 레이아웃 안정화 */
        .ui-panel { position: absolute; pointer-events: none; z-index: 10; }
        .interactive { pointer-events: auto; }

        /* 상단 상태 바 */
        #stat-bar { top: 20px; left: 20px; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; border: 2px solid #444; min-width: 250px; }
        .bar-container { background: #333; width: 100%; height: 15px; border-radius: 10px; margin: 5px 0 10px 0; overflow: hidden; }
        .bar { height: 100%; width: 100%; }
        #hp-bar { background: #ff4757; }
        #exp-bar { background: #2ed573; }
        #level-text { font-weight: bold; color: #ffa502; font-size: 18px; margin-bottom: 5px; }

        /* 우측 상단 미니맵 */
        #minimap-container { top: 20px; right: 20px; background: rgba(0,0,0,0.85); border: 2px solid #666; border-radius: 6px; padding: 5px; }
        #minimap { background: #000; display: block; border: 1px solid #444; }

        /* 하단 스킬 바 (이모지 제거 및 텍스트 대체) */
        #skill-bar { bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 12px; border: 2px solid #555; }
        .skill-slot { width: 55px; height: 55px; background: #222; border: 2px solid #666; border-radius: 8px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: #fff; }
        .skill-name { margin-top: 10px; font-size: 11px; color: #ffa502; }
        .skill-slot .cooldown-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(255,0,0,0.4); border-radius: 6px; transition: height 0.1s linear; }
        .skill-slot .key-bind { position: absolute; top: 2px; left: 4px; font-size: 10px; color: #aaa; }

        /* 우측 인벤토리 */
        #inventory-toggle { top: 20px; right: 170px; background: #ffa502; color: black; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; }
        #inventory { top: 70px; right: 20px; width: 220px; background: rgba(0,0,0,0.95); border: 2px solid #ff4757; border-radius: 8px; padding: 15px; display: none; }
        .inv-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; text-align: center; border-bottom: 1px solid #444; padding-bottom: 5px; color: #ffa502; }
        .inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .inv-slot { width: 42px; height: 42px; background: #222; border: 1px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; font-size: 12px; }
        .inv-slot:hover { border-color: #ffa502; background: #333; }
        .item-count { position: absolute; bottom: 2px; right: 4px; font-size: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 0 2px; border-radius: 2px; }

        /* 알림 메시지 */
        #game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 40px; border-radius: 10px; text-align: center; border: 2px solid #ff4757; }
        #game-over h2 { color: #ff4757; font-size: 36px; margin-bottom: 20px; }
        #game-over button { background: #ff4757; color: white; border: none; padding: 10px 20px; font-size: 18px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI: 능력치 상태창 -->
    <div id="stat-bar" class="ui-panel">
        <div id="level-text">LV. 1 네크로맨서</div>
        <div>HP</div>
        <div class="bar-container"><div id="hp-bar" class="bar"></div></div>
        <div>EXP</div>
        <div class="bar-container"><div id="exp-bar" class="bar"></div></div>
        <div id="score-text" style="font-size:12px; color:#aaa;">처치 수: 0 | 공격력: 15</div>
    </div>

    <!-- UI: 미니맵 -->
    <div id="minimap-container" class="ui-panel">
        <canvas id="minimap" width="120" height="120"></canvas>
    </div>

    <!-- UI: 인벤토리 토글 (이모지 제거) -->
    <button id="inventory-toggle" class="ui-panel interactive" onclick="toggleInventory()">[I] INVENTORY</button>
    <div id="inventory" class="ui-panel interactive">
        <div class="inv-title">소지품 창</div>
        <div class="inv-grid" id="inv-grid"></div>
    </div>

    <!-- UI: 하단 스킬 슬롯 (이모지 제거, 텍스트 변환) -->
    <div id="skill-bar" class="ui-panel interactive">
        <div class="skill-slot" id="skill-q" onclick="useSkillQ()" style="cursor:pointer;">
            <span class="key-bind">Q</span>
            <span class="skill-name">MULTI</span>
            <div class="cooldown-overlay" id="cooldown-q"></div>
        </div>
        <div class="skill-slot" id="skill-e" onclick="useSkillE()" style="cursor:pointer;">
            <span class="key-bind">E</span>
            <span class="skill-name">HEAL</span>
            <div class="cooldown-overlay" id="cooldown-e"></div>
        </div>
        <div class="skill-slot" id="skill-r" onclick="useSkillR()" style="cursor:pointer;">
            <span class="key-bind">R</span>
            <span class="skill-name">ULTI</span>
            <div class="cooldown-overlay" id="cooldown-r"></div>
        </div>
    </div>

    <!-- UI: 게임 오버 -->
    <div id="game-over" class="ui-panel interactive">
        <h2>GAME OVER</h2>
        <button onclick="location.reload()">다시 시작</button>
    </div>
</div>

<script>
    // 안전한 엘리먼트 로드 확인
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const mCanvas = document.getElementById("minimap");
    const mCtx = mCanvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth || 800;
        canvas.height = window.innerHeight || 600;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const WORLD_SIZE = 2000;

    // 절대 멈추지 않는 방어형 데이터 구조 정의
    const game = {
        player: { x: 1000, y: 1000, radius: 18, speed: 4.5, hp: 100, maxHp: 100, level: 1, exp: 0, maxExp: 100, damage: 15, kills: 0 },
        bullets: [],
        monsters: [],
        items: [],
        keys: {},
        mouse: { x: 1000, y: 1000 },
        camera: { x: 0, y: 0 },
        skills: {
            q: { cooldown: 2000, lastUsed: 0 },
            e: { cooldown: 4000, lastUsed: 0 },
            r: { cooldown: 8000, lastUsed: 0 }
        },
        inventory: [
            { id: 'potion', name: 'POTION', count: 5 },
            { id: 'ruby', name: 'RUBY', count: 0 }
        ]
    };

    // 키보드 핸들러 무조건 수집 (시스템 락 방지)
    window.addEventListener('keydown', function(e) {
        if (!e.key) return;
        const key = e.key.toLowerCase();
        game.keys[key] = true;
        
        if(key === 'i') toggleInventory();
        if(key === 'q') useSkillQ();
        if(key === 'e') useSkillE();
        if(key === 'r') useSkillR();
    });
    
    window.addEventListener('keyup', function(e) {
        if (!e.key) return;
        game.keys[e.key.toLowerCase()] = false;
    });

    // 마우스 좌표 계산 에러 방지 처리 (핵심 버그 수정점)
    canvas.addEventListener('mousemove', function(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        game.mouse.x = (e.clientX - rect.left) * scaleX + game.camera.x;
        game.mouse.y = (e.clientY - rect.top) * scaleY + game.camera.y;
    });

    canvas.addEventListener('mousedown', function(e) {
        if (e.button === 0) {
            e.preventDefault();
            shootNormal();
        }
    });


    // Robust UI listeners: buttons/skill slots work even if inline handlers are blocked.
    document.getElementById('inventory-toggle').addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        toggleInventory();
    });
    document.getElementById('skill-q').addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        useSkillQ();
    });
    document.getElementById('skill-e').addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        useSkillE();
    });
    document.getElementById('skill-r').addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        useSkillR();
    });

    function toggleInventory() {
        const inv = document.getElementById("inventory");
        if(!inv) return;
        if(inv.style.display === "block") {
            inv.style.display = "none";
        } else {
            inv.style.display = "block";
            renderInventory();
        }
    }

    function renderInventory() {
        const grid = document.getElementById("inv-grid");
        if(!grid) return;
        grid.innerHTML = "";
        for (let i = 0; i < 16; i++) {
            const slot = document.createElement("div");
            slot.className = "inv-slot";
            if(game.inventory[i] && game.inventory[i].count > 0) {
                slot.innerText = game.inventory[i].name;
                const countSpan = document.createElement("span");
                countSpan.className = "item-count";
                countSpan.innerText = game.inventory[i].count;
                slot.appendChild(countSpan);
                
                if(game.inventory[i].id === 'potion') {
                    slot.onclick = function(e) {
                        if(e) e.stopPropagation();
                        useSkillE();
                    };
                }
            }
            grid.appendChild(slot);
        }
    }

    function shootNormal() {
        const angle = Math.atan2(game.mouse.y - game.player.y, game.mouse.x - game.player.x);
        game.bullets.push({
            x: game.player.x, y: game.player.y,
            vx: Math.cos(angle) * 9, vy: Math.sin(angle) * 9,
            radius: 5, damage: game.player.damage, color: '#ffa502', type: 'player'
        });
    }

    function useSkillQ() {
        const now = Date.now();
        if(now - game.skills.q.lastUsed < game.skills.q.cooldown) return;
        game.skills.q.lastUsed = now;
const baseAngle = Math.atan2(game.mouse.y - game.player.y, game.mouse.x - game.player.x);
const spreads = [-0.2, 0, 0.2];
spreads.forEach(function(spread) {
game.bullets.push({
x: game.player.x, y: game.player.y,
vx: Math.cos(baseAngle + spread) * 11, vy: Math.sin(baseAngle + spread) * 11,
radius: 5, damage: game.player.damage, color: '#2ed573', type: 'player'
});
});
}
function useSkillE() {
const now = Date.now();
if(now - game.skills.e.lastUsed < game.skills.e.cooldown) return;
const potion = game.inventory[0]; // 포션 인덱스 고정 고정
if(potion && potion.count > 0) {
potion.count--;
game.skills.e.lastUsed = now;
game.player.hp = Math.min(game.player.maxHp, game.player.hp + 35);
renderInventory();
}
}
function useSkillR() {
const now = Date.now();
if(now - game.skills.r.lastUsed < game.skills.r.cooldown) return;
game.skills.r.lastUsed = now;
for(let i=0; i<12; i++) {
const angle = (Math.PI * 2 / 12) * i;
game.bullets.push({
x: game.player.x, y: game.player.y,
vx: Math.cos(angle) * 6, vy: Math.sin(angle) * 6,
radius: 7, damage: game.player.damage * 2, color: '#9b59b6', type: 'player'
});
}
}
function spawnMonster() {
if(game.monsters.length >= 25) return;
const angle = Math.random() * Math.PI * 2;
const dist = 450 + Math.random() * 200;
let mx = game.player.x + Math.cos(angle) * dist;
let my = game.player.y + Math.sin(angle) * dist;
mx = Math.max(40, Math.min(mx, WORLD_SIZE-40));
my = Math.max(40, Math.min(my, WORLD_SIZE-40));
const isElite = Math.random() > 0.85;
game.monsters.push({
x: mx, y: my,
radius: isElite ? 22 : 15,
speed: isElite ? 1.6 : 2.3,
hp: isElite ? 90 : 30,
maxHp: isElite ? 90 : 30,
damage: isElite ? 18 : 7,
color: isElite ? '#ffbe0b' : '#ff007f',
isElite: isElite
});
}
// 모든 연산 로직을 에러 억제 모드로 실행
function updateLogic() {
let moveX = 0; let moveY = 0;
if (game.keys['w'] || game.keys['arrowup']) moveY -= 1;
if (game.keys['s'] || game.keys['arrowdown']) moveY += 1;
if (game.keys['a'] || game.keys['arrowleft']) moveX -= 1;
if (game.keys['d'] || game.keys['arrowright']) moveX += 1;
if(moveX !== 0 && moveY !== 0) { moveX *= 0.707; moveY *= 0.707; }
game.player.x += moveX * game.player.speed;
game.player.y += moveY * game.player.speed;
game.player.x = Math.max(game.player.radius, Math.min(game.player.x, WORLD_SIZE - game.player.radius));
game.player.y = Math.max(game.player.radius, Math.min(game.player.y, WORLD_SIZE - game.player.radius));
game.camera.x = game.player.x - canvas.width / 2;
game.camera.y = game.player.y - canvas.height / 2;
// 투사체 처리
for(let i = game.bullets.length - 1; i >= 0; i--) {
let b = game.bullets[i];
b.x += b.vx; b.y += b.vy;
if(b.x < 0 || b.x > WORLD_SIZE || b.y < 0 || b.y > WORLD_SIZE) {
game.bullets.splice(i, 1);
continue;
}
for(let j = game.monsters.length - 1; j >= 0; j--) {
let m = game.monsters[j];
let dist = Math.hypot(b.x - m.x, b.y - m.y);
if(dist < b.radius + m.radius) {
m.hp -= b.damage;
game.bullets.splice(i, 1);
if(m.hp <= 0) {
if(Math.random() > 0.5) {
game.items.push({
x: m.x, y: m.y, radius: 7,
id: Math.random() > 0.7 ? 'potion' : 'ruby',
color: '#00f5ff'
});
}
game.monsters.splice(j, 1);
game.player.kills++;
gainExp(m.isElite ? 35 : 15);
}
break;
}
}
}
// 몬스터 AI
game.monsters.forEach(function(m) {
let angle = Math.atan2(game.player.y - m.y, game.player.x - m.x);
m.x += Math.cos(angle) * m.speed;
m.y += Math.sin(angle) * m.speed;
let dist = Math.hypot(game.player.x - m.x, game.player.y - m.y);
if(dist < game.player.radius + m.radius) {
game.player.hp -= m.damage * 0.02;
if(game.player.hp <= 0) {
game.player.hp = 0;
const go = document.getElementById("game-over");
if(go) go.style.display = "block";
}
}
});
// 아이템 먹기
for(let i = game.items.length - 1; i >= 0; i--) {
let item = game.items[i];
let dist = Math.hypot(game.player.x - item.x, game.player.y - item.y);
if(dist < game.player.radius + item.radius) {
let idx = item.id === 'potion' ? 0 : 1;
game.inventory[idx].count++;
renderInventory();
game.items.splice(i, 1);
}
}
}
function gainExp(amount) {
game.player.exp += amount;
if(game.player.exp >= game.player.maxExp) {
game.player.exp -= game.player.maxExp;
game.player.level++;
game.player.maxExp = Math.floor(game.player.maxExp * 1.3);
game.player.maxHp += 20;
game.player.hp = game.player.maxHp;
game.player.damage += 5;
}
}
function updateUI() {
const hb = document.getElementById("hp-bar");
const eb = document.getElementById("exp-bar");
const lt = document.getElementById("level-text");
const st = document.getElementById("score-text");
if(hb) hb.style.width = Math.max(0, (game.player.hp / game.player.maxHp * 100)) + "%";
if(eb) eb.style.width = Math.min(100, (game.player.exp / game.player.maxExp * 100)) + "%";
if(lt) lt.innerText = "LV. " + game.player.level + " 네크로맨서";
if(st) st.innerText = "처치 수: " + game.player.kills + " | 공격력: " + game.player.damage;
const now = Date.now();
['q','e','r'].forEach(function(sk) {
const skill = game.skills[sk];
const passed = now - skill.lastUsed;
const percentage = Math.max(0, 100 - (passed / skill.cooldown * 100));
const co = document.getElementById("cooldown-" + sk);
if(co) co.style.height = percentage + "%";
});
}
function drawGame() {
if(!ctx) return;
// 캔버스 자체 강제 초기화 및 블랙 페인팅
ctx.fillStyle = "#161616";
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.save();
ctx.translate(-game.camera.x, -game.camera.y);
// 1. 바닥 그리드 바둑판 (가시성 대폭 상향)
ctx.strokeStyle = "#3a3a3a";
ctx.lineWidth = 1;
const spacing = 100;
for(let x=0; x<=WORLD_SIZE; x+=spacing) {
ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
}
for(let y=0; y<=WORLD_SIZE; y+=spacing) {
ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
}
// 월드 테두리 경계선
ctx.strokeStyle = "#ff4757";
ctx.lineWidth = 4;
ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);
// 2. 아이템 그리기
game.items.forEach(function(item) {
ctx.fillStyle = item.color;
ctx.beginPath(); ctx.arc(item.x, item.y, item.radius, 0, Math.PI*2); ctx.fill();
});
// 3. 몬스터 그리기
game.monsters.forEach(function(m) {
ctx.fillStyle = m.color;
ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = "rgba(0,0,0,0.6)";
ctx.fillRect(m.x - m.radius, m.y - m.radius - 10, m.radius * 2, 4);
ctx.fillStyle = "#ff4757";
ctx.fillRect(m.x - m.radius, m.y - m.radius - 10, (m.hp / m.maxHp) * m.radius * 2, 4);
});
// 4. 총알 그리기
game.bullets.forEach(function(b) {
ctx.fillStyle = b.color;
ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill();
});
// 5. 플레이어 캐릭터 (하늘색 원형 아바타) 강제 드로잉
ctx.fillStyle = "#00bcff";
ctx.beginPath();
ctx.arc(game.player.x, game.player.y, game.player.radius, 0, Math.PI*2);
ctx.fill();
ctx.strokeStyle = "#ffffff";
ctx.lineWidth = 3;
ctx.stroke();
ctx.restore();
}
function drawMinimap() {
if(!mCtx) return;
mCtx.fillStyle = "#0a0a0a";
mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
const scale = mCanvas.width / WORLD_SIZE;
// 내 위치 초록색 점
mCtx.fillStyle = "#00ffcc";
mCtx.beginPath();
mCtx.arc(game.player.x * scale, game.player.y * scale, 4, 0, Math.PI*2);
mCtx.fill();
// 몬스터 빨간 점
mCtx.fillStyle = "#ff3366";
game.monsters.forEach(function(m) {
mCtx.beginPath();
mCtx.arc(m.x * scale, m.y * scale, 2, 0, Math.PI*2);
mCtx.fill();
});
}
// 주기적 몬스터 소환 개시
setInterval(spawnMonster, 1500);
renderInventory();
// 절대로 중간에 멈추지 않는 방어적 무한 루프 구현
function loop() {
try {
updateLogic();
drawGame();
drawMinimap();
updateUI();
} catch (e) {
// 브라우저 콘솔창 오류 검출용
console.log("Error inside loop: " + e.message);
}
requestAnimationFrame(loop);
}
// 즉시 루프 구동 실행
loop();
</script>
</body>
</html>
