<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG Shooter - Final</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body {
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #111;
}

canvas {
    display: block;
    background: #161616;
    width: 100%;
    height: 100%;
    border: 1px solid #333;
}

.screen {
    display: none;
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 100;
}

.screen.active {
    display: block;
}

#main-menu {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    display: none !important;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#main-menu.active {
    display: flex !important;
}

#main-menu h1 {
    font-size: 60px;
    color: #00f5ff;
    margin-bottom: 30px;
    text-shadow: 0 0 20px #00f5ff;
}

#main-menu .menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

#main-menu button {
    padding: 15px 60px;
    font-size: 24px;
    background: #00f5ff;
    color: #000;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: bold;
}

#main-menu button:hover {
    background: #00d4ff;
    transform: scale(1.05);
    box-shadow: 0 0 20px #00f5ff;
}

.ui-panel {
    position: absolute;
    pointer-events: none;
    z-index: 10;
}

.interactive {
    pointer-events: auto;
}

/* =========================
   스탯
========================= */

#stat-bar {
    top: 20px;
    left: 20px;
    background: rgba(0,0,0,0.85);
    padding: 15px;
    border-radius: 8px;
    border: 2px solid #00f5ff;
    min-width: 330px;
}

.bar-container {
    background: #333;
    width: 100%;
    height: 15px;
    border-radius: 10px;
    margin: 5px 0 10px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 100%;
}

#hp-bar {
    background: #ff4757;
}

#exp-bar {
    background: #2ed573;
}

#level-text {
    font-weight: bold;
    color: #ffa502;
    font-size: 18px;
    margin-bottom: 5px;
}

#zone-text {
    font-size: 14px;
    color: #00f5ff;
    margin-top: 5px;
}

/* =========================
   미니맵
========================= */

#minimap-container {
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.85);
    border: 2px solid #666;
    border-radius: 6px;
    padding: 5px;
    z-index: 20;
}

#minimap {
    background: #000;
    display: block;
    border: 1px solid #444;
}

/* =========================
   맵 버튼
========================= */

#map-toggle {
    top: 20px;
    right: 280px;
    background: #00f5ff;
    color: #000;
    padding: 10px 15px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    border: none;
}

#map-toggle:hover {
    background: #1affff;
}

/* =========================
   인벤 / 스킬 버튼
========================= */

#inventory-toggle {
    top: 20px;
    right: 150px;
    background: #ffa502;
    color: black;
    padding: 10px 15px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    border: none;
}

#skill-toggle {
    top: 20px;
    right: 70px;
    background: #9b59b6;
    color: white;
    padding: 10px 15px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    border: none;
}

#inventory-toggle:hover {
    background: #ffb71a;
}

#skill-toggle:hover {
    background: #b66bd0;
}

/* =========================
   패널
========================= */

#inventory,
#skill-window,
#shop {
    top: 70px;
    right: 20px;
    width: 400px;
    background: rgba(0,0,0,0.96);
    border: 2px solid #ff4757;
    border-radius: 8px;
    padding: 15px;
    display: none;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    z-index: 100;
}

#skill-window {
    border-color: #00f5ff;
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.inv-title {
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    border-bottom: 1px solid #444;
    padding-bottom: 5px;
    color: #ffa502;
    flex: 1;
}

.close-btn {
    background: #ff4757;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 5px 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.close-btn:hover {
    background: #ff3838;
}

/* =========================
   장비
========================= */

.equipment-section {
    margin-bottom: 15px;
}

.equipment-title {
    color: #00f5ff;
    font-weight: bold;
    text-align: center;
    margin-bottom: 8px;
}

.equipment-slots {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.equipment-slot {
    width: 165px;
    min-height: 80px;
    background: #181818;
    border: 2px solid #555;
    border-radius: 6px;
    padding: 8px;
    text-align: center;
    cursor: pointer;
}

.equipment-slot:hover {
    border-color: #00f5ff;
    background: #222;
}

.equipment-label {
    color: #888;
    font-size: 11px;
}

.equipped-name {
    color: #ffa502;
    font-weight: bold;
    margin-top: 5px;
}

.equipped-stat {
    color: #aaa;
    font-size: 11px;
    margin-top: 4px;
}

/* =========================
   아이템 핫바
========================= */

.hotbar-title {
    color: #00f5ff;
    text-align: center;
    font-size: 13px;
    margin: 10px 0 7px;
}

.hotbar {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 15px;
}

.hotbar-slot {
    width: 58px;
    height: 58px;
    background: #222;
    border: 2px solid #555;
    border-radius: 5px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
}

.hotbar-slot:hover {
    border-color: #ffa502;
}

.hotbar-slot.selected {
    border-color: #00f5ff;
    box-shadow: 0 0 8px #00f5ff;
}

.hotbar-number {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 10px;
    color: #aaa;
}

.hotbar-count {
    position: absolute;
    bottom: 2px;
    right: 4px;
    font-size: 10px;
    color: #fff;
    background: rgba(0,0,0,0.8);
    padding: 1px 3px;
    border-radius: 3px;
}

/* =========================
   인벤
========================= */

.inv-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.inv-slot {
    width: 58px;
    height: 58px;
    background: #222;
    border: 1px solid #555;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    font-size: 26px;
}

.inv-slot:hover {
    border-color: #ffa502;
    background: #333;
}

.inv-slot.empty {
    cursor: default;
    opacity: 0.5;
}

.inv-slot.empty:hover {
    border-color: #555;
    background: #222;
}

.item-count {
    position: absolute;
    bottom: 2px;
    right: 4px;
    font-size: 10px;
    color: #fff;
    background: rgba(0,0,0,0.7);
    padding: 0 2px;
    border-radius: 2px;
}

/* =========================
   스킬창
========================= */

.skill-window-info {
    color: #aaa;
    font-size: 11px;
    text-align: center;
    margin-bottom: 10px;
}

.active-skill-title {
    color: #00f5ff;
    text-align: center;
    font-size: 13px;
    margin: 8px 0;
}

.active-skill-grid {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 15px;
}

.active-skill-slot {
    width: 62px;
    height: 62px;
    background: #222;
    border: 2px solid #666;
    border-radius: 6px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
}

.active-skill-slot:hover {
    border-color: #00f5ff;
}

.active-skill-slot .active-key {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 9px;
    color: #aaa;
}

.active-skill-slot .active-icon {
    font-size: 22px;
}

.active-skill-slot .active-name {
    color: #ffa502;
    font-size: 9px;
    margin-top: 3px;
}

.skill-list-title {
    color: #ffa502;
    font-size: 12px;
    text-align: center;
    border-bottom: 1px solid #444;
    padding-bottom: 5px;
    margin-bottom: 8px;
}

.skill-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.skill-card {
    background: #191919;
    border: 1px solid #555;
    border-radius: 5px;
    padding: 10px 5px;
    text-align: center;
    cursor: pointer;
}

.skill-card:hover {
    border-color: #00f5ff;
    background: #292929;
}

.skill-card.equipped {
    border-color: #ffa502;
}

.skill-card-icon {
    font-size: 25px;
}

.skill-card-name {
    color: #ffa502;
    font-size: 12px;
    font-weight: bold;
    margin-top: 4px;
}

.skill-card-desc {
    color: #aaa;
    font-size: 9px;
    margin-top: 3px;
}

.skill-card-status {
    color: #00f5ff;
    font-size: 9px;
    margin-top: 4px;
}

/* =========================
   화면 아이템 핫바
========================= */

#item-hotbar {
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    background: rgba(0,0,0,0.88);
    padding: 5px 6px;
    border-radius: 8px;
    border: 2px solid #555;
    z-index: 30;
}

.item-hud-slot {
    width: 55px;
    height: 55px;
    background: #222;
    border: 2px solid #666;
    border-radius: 7px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    cursor: pointer;
}

.item-hud-slot:hover {
    border-color: #ffa502;
}

.item-hud-slot.selected {
    border-color: #00f5ff;
    box-shadow: 0 0 8px #00f5ff;
}

.item-hud-slot .item-key {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 9px;
    color: #aaa;
}

.item-hud-slot .item-hud-count {
    position: absolute;
    right: 3px;
    bottom: 2px;
    font-size: 9px;
    background: rgba(0,0,0,0.8);
    padding: 1px 3px;
    border-radius: 3px;
}

/* =========================
   화면 스킬바
========================= */

#skill-bar {
    bottom: 95px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    background: rgba(0,0,0,0.88);
    padding: 10px 12px;
    border-radius: 12px;
    border: 2px solid #555;
    z-index: 30;
}

.skill-slot {
    width: 62px;
    height: 62px;
    background: #222;
    border: 2px solid #666;
    border-radius: 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
}

.skill-slot:hover {
    border-color: #00f5ff;
}

.skill-slot.selected {
    border-color: #ffa502;
}

.skill-slot .skill-icon {
    font-size: 22px;
}

.skill-slot .key-bind {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 10px;
    color: #aaa;
}

.skill-slot .skill-name {
    margin-top: 3px;
    font-size: 10px;
    color: #ffa502;
}

.cooldown-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: rgba(255,0,0,0.45);
    border-radius: 6px;
    pointer-events: none;
}

/* =========================
   상점
========================= */

.shop-item {
    background: #1a1a1a;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 10px;
    margin-bottom: 10px;
    cursor: pointer;
}

.shop-item:hover {
    border-color: #ffa502;
    background: #333;
}

.shop-item-name {
    font-weight: bold;
    color: #00f5ff;
}

.shop-item-price {
    color: #ffa502;
    font-size: 12px;
    margin-top: 4px;
}

/* =========================
   맵창
========================= */

#map-window {
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, 90vw);
    height: min(650px, 80vh);
    background: rgba(0,0,0,0.97);
    border: 2px solid #00f5ff;
    border-radius: 10px;
    padding: 15px;
    display: none;
    z-index: 200;
}

#big-map {
    width: 100%;
    height: calc(100% - 45px);
    background: #111;
    border: 1px solid #555;
}

/* =========================
   지역
========================= */

#zone-select {
     top: 50%;
     left: 50%;
     transform: translate(-50%, -50%);
     width: min(430px, 90vw);
     background: rgba(0,0,0,0.97);
     border: 2px solid #00f5ff;
     border-radius: 10px;
     padding: 15px;
     display: none;
     z-index: 300;
 }

.zone-select-title {
     font-size: 14px;
     font-weight: bold;
     color: #00f5ff;
     flex: 1;
 }

.zone-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.zone-btn {
    padding: 8px 12px;
    background: #333;
    border: 1px solid #666;
    color: #fff;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
}

.zone-btn:hover {
    background: #00f5ff;
    color: #000;
}

.zone-btn.active {
    background: #00f5ff;
    color: #000;
    font-weight: bold;
}

/* =========================
   구조물
========================= */

.structure-interact {
    position: fixed;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.9);
    border: 2px solid #00f5ff;
    border-radius: 8px;
    padding: 15px 20px;
    color: #00f5ff;
    font-weight: bold;
    z-index: 150;
}

.structure-close-btn {
     position: absolute;
     top: 6px;
     right: 6px;
     padding: 3px 7px;
     font-size: 12px;
 }

 .structure-interact button {
    background: #00f5ff;
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 10px 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* =========================
   강화
========================= */

#forge-panel {
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 370px;
    background: rgba(0,0,0,0.96);
    border: 2px solid #e74c3c;
    border-radius: 8px;
    padding: 15px;
    display: none;
    z-index: 200;
}

#forge-info {
    text-align: center;
    line-height: 1.8;
    margin-bottom: 12px;
}

#forge-upgrade-button {
    width: 100%;
    padding: 10px;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

/* =========================
   게임오버
========================= */

#game-over {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.95);
    padding: 40px;
    border-radius: 10px;
    text-align: center;
    border: 2px solid #ff4757;
    z-index: 600;
}

#game-over h2 {
    color: #ff4757;
    font-size: 36px;
    margin-bottom: 20px;
}

#game-over button {
    background: #ff4757;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 5px;
    cursor: pointer;
    margin: 10px 5px;
}

.drop-notification {
    position: fixed;
    right: 20px;
    top: 200px;
    background: rgba(0,0,0,0.9);
    border: 2px solid #00f5ff;
    border-radius: 8px;
    padding: 12px 15px;
    max-width: 250px;
    z-index: 1000;
    animation: slideIn 0.3s;
}

@keyframes slideIn {
    from {
        transform: translateX(300px);
    }

    to {
        transform: translateX(0);
    }
}

/* =========================
   일시정지
========================= */

#pause-overlay {
    display: none;
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 500;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#pause-overlay.active {
    display: flex !important;
}

#pause-overlay h2 {
    font-size: 48px;
    color: #00f5ff;
    margin-bottom: 40px;
}

#pause-overlay .menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

#pause-overlay button {
    padding: 12px 40px;
    font-size: 20px;
    background: #00f5ff;
    color: #000;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* =========================
   컴팩트 상태 UI
========================= */
#stat-bar { display:none !important; }

.compact-status {
    left: 20px;
    width: 220px;
    background: rgba(0,0,0,0.82);
    border-radius: 6px;
    padding: 6px 8px;
    border: 1px solid #555;
    z-index: 20;
}

.hp-status { top: 20px; border-color: #ff4757; }
.exp-status { top: 58px; border-color: #2ed573; }

.status-label {
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 4px;
}

.hp-status .status-label { color: #ff6b81; }
.exp-status .status-label { color: #2ed573; }

.compact-bar {
    width: 100%;
    height: 8px;
    background: #333;
    border-radius: 6px;
    overflow: hidden;
}

#hp-status #hp-bar { background: #ff4757; }
#exp-status #exp-bar { background: #2ed573; }

.status-box {
    top: 96px;
    left: 20px;
    width: 220px;
    background: rgba(0,0,0,0.78);
    border: 1px solid #555;
    border-radius: 6px;
    padding: 7px 9px;
    z-index: 20;
}

.status-box #level-text {
    font-size: 14px;
    margin-bottom: 3px;
}

.status-box #score-text {
    font-size: 10px !important;
    color: #aaa;
}

.status-box #zone-text {
    font-size: 11px;
    margin-top: 3px;
}

/* 오른쪽 상단 UI 버튼은 미니맵 아래로 정리 */
#map-toggle { top: 150px; right: 180px; }
#inventory-toggle { top: 150px; right: 92px; }
#skill-toggle { top: 150px; right: 20px; }

</style>
</head>

<body>

<div id="game-container">

<div id="main-menu" class="screen active">

    <h1>⚔️ RPG SHOOTER ⚔️</h1>

    <div class="menu-buttons">

        <button onclick="startGame()">
            게임 시작
        </button>

        <button onclick="showCredits()">
            게임 정보
        </button>

    </div>

</div>


<div id="game-screen" class="screen">

<canvas id="gameCanvas"></canvas>


<div id="status-info" class="ui-panel status-box">
    <div id="level-text">LV. 1 네크로맨서</div>
    <div id="score-text">처치: 0 | 공격력: 25 | 방어력: 0</div>
    <div id="zone-text">🗺️ 마을</div>
</div>

<div id="hp-status" class="ui-panel compact-status hp-status">
    <div class="status-label">HP</div>
    <div class="compact-bar"><div id="hp-bar" class="bar"></div></div>
</div>

<div id="exp-status" class="ui-panel compact-status exp-status">
    <div class="status-label">EXP</div>
    <div class="compact-bar"><div id="exp-bar" class="bar"></div></div>
</div>


<div id="minimap-container"
     class="ui-panel">

    <canvas
        id="minimap"
        width="120"
        height="120">
    </canvas>

</div>


<button
    id="map-toggle"
    class="ui-panel interactive"
    onclick="toggleZoneSelect()">

    [M] 지역 이동

</button>


<button
    id="inventory-toggle"
    class="ui-panel interactive"
    onclick="toggleInventory()">

    [I] 인벤

</button>


<button
    id="skill-toggle"
    class="ui-panel interactive"
    onclick="openSkillWindow()">

    [K] 스킬

</button>


<!-- =========================
     인벤토리
========================= -->

/* =========================================================

========================================================= */

function clamp(v,min,max) {

    return Math.max(
        min,
        Math.min(max,v)
    );

}


function distance(a,b) {

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


function normalizeAngle(angle) {

    while(angle > Math.PI)
        angle -= Math.PI*2;

    while(angle < -Math.PI)
        angle += Math.PI*2;

    return angle;

}


function getInventoryItem(id) {

    return game.inventory.find(
        item =>
            item &&
            item.id === id
    );

}


function getInventoryIndex(id) {

    return game.inventory.findIndex(
        item =>
            item &&
            item.id === id
    );

}


/*
 * 빈 인벤 슬롯을 찾는다.
 */
function getEmptyInventorySlot() {

    return game.inventory.findIndex(
        item => item === null
    );

}


/*
 * 아이템을 인벤에 추가.
 */
function addToInventory(id,count=1) {

    const data = ITEMS[id];

    if(!data)
        return false;

    /*
     * 금화는 별도 골드 수치와 동기화.
     */
    if(id === "gold") {

        game.player.gold += count;

        syncGoldInventory();

        renderInventory();
        updateUI();

        return true;

    }

    let existing =
        getInventoryItem(id);

    if(existing) {

        existing.count += count;

        renderInventory();

        return true;

    }

    const empty =
        getEmptyInventorySlot();

    if(empty === -1) {

        showDropNotification(
            "🎒 인벤토리가 가득 찼습니다."
        );

        return false;

    }

    game.inventory[empty] = {
        id:id,
        count:count
    };

    renderInventory();

    return true;

}


/*
 * 골드 아이템은 항상 인벤에서
 * 현재 골드 수치를 보여준다.
 */
function syncGoldInventory() {

    const index =
        getInventoryIndex("gold");

    if(index !== -1) {

        game.inventory[index].count =
            game.player.gold;

    }

}


/*
 * 인벤에서 아이템 제거.
 */
function removeFromInventory(id,count=1) {

    if(id === "gold") {

        if(game.player.gold < count)
            return false;

        game.player.gold -= count;

        syncGoldInventory();
        renderInventory();

        return true;

    }

    const index =
        getInventoryIndex(id);

    if(index === -1)
        return false;

    const item =
        game.inventory[index];

    if(item.count < count)
        return false;

    item.count -= count;

    if(item.count <= 0) {

        game.inventory[index] = null;

        /*
         * 해당 슬롯이 핫바에 있었다면
         * 자동으로 핫바에서도 제거.
         */
        for(let i=0;i<5;i++) {

            if(game.itemHotbar[i] === index)
                game.itemHotbar[i] = null;

        }

    }

    renderInventory();

    return true;

}


/* =========================================================
   EQUIPMENT
========================================================= */

function getEquippedWeapon() {

    if(!game.equipment.weapon)
        return null;

    return ITEMS[
        game.equipment.weapon
    ];

}


function getEquippedArmor() {

    if(!game.equipment.armor)
        return null;

    return ITEMS[
        game.equipment.armor
    ];

}


function getWeaponUpgradeLevel() {

    if(!game.equipment.weapon)
        return 0;

    return game.weaponUpgrade[
        game.equipment.weapon
    ] || 0;

}


function getTotalAttackDamage() {

    const weapon =
        getEquippedWeapon();

    let damage =
        game.player.damage;

    if(weapon) {

        damage +=
            weapon.damage || 0;

        damage +=
            getWeaponUpgradeLevel() * 2;

    }

    return Math.round(damage);

}


function getDefense() {

    const armor =
        getEquippedArmor();

    return armor
        ? armor.defense || 0
        : 0;

}


function equipItem(id) {

    const item = ITEMS[id];

    if(!item)
        return;

    const index =
        getInventoryIndex(id);

    if(index === -1)
        return;

    if(item.type === "weapon") {

        /*
         * 기존 무기가 장착되어 있으면
         * 기존 무기는 인벤에 남아 있음.
         */
        game.equipment.weapon = id;

        showDropNotification(
            `${item.emoji} ${item.name} 장착`
        );

    }

    else if(item.type === "armor") {

        game.equipment.armor = id;

        showDropNotification(
            `${item.emoji} ${item.name} 장착`
        );

    }

    renderInventory();
    updateUI();

}

    const weaponId =
        game.equipment.weapon;

    if(!weaponId)
        return;

    /*
     * 이미 인벤에 무기가 있으면
     * 같은 아이템을 하나 더 만들지 않는다.
     */
    if(
        getInventoryIndex(weaponId) === -1
    ) {

        const empty =
            getEmptyInventorySlot();

        if(empty === -1) {

            showDropNotification(
                "🎒 인벤토리가 가득 차서 무기를 해제할 수 없습니다."
            );

            return;

        }

        game.inventory[empty] = {
            id:weaponId,
            count:1
        };

    }

    game.equipment.weapon = null;

    showDropNotification(
        "⚔️ 무기를 해제했습니다."
    );

    renderInventory();
    updateUI();

}


function unequipArmor() {

    const armorId =
        game.equipment.armor;

    if(!armorId)
        return;

    /*
     * 해제하면 인벤으로 돌아감.
     */
    const existing =
        getInventoryItem(armorId);

    if(existing) {

        existing.count++;

    }
    else {

        const empty =
            getEmptyInventorySlot();

        if(empty === -1) {

            showDropNotification(
                "🎒 인벤토리가 가득 차서 갑옷을 해제할 수 없습니다."
            );

            return;

        }

        game.inventory[empty] = {
            id:armorId,
            count:1
        };

    }

    game.equipment.armor = null;

    showDropNotification(
        "🛡️ 갑옷을 인벤토리로 돌려놓았습니다."
    );

    renderInventory();
    updateUI();

}

/* =========================================================
   INVENTORY
========================================================= */

function renderInventory() {

    const grid =
        document.getElementById(
            "inv-grid"
        );

    if(!grid)
        return;

    grid.innerHTML = "";

    for(
        let index=0;
        index<game.inventory.length;
        index++
    ) {

        const item =
            game.inventory[index];

        const slot =
            document.createElement("div");

        slot.className = "inv-slot";

        if(!item) {

            slot.classList.add("empty");

            slot.innerHTML = "";

            grid.appendChild(slot);

            continue;

        }

        const data =
            ITEMS[item.id];

        if(!data)
            continue;

        slot.innerHTML = `
            ${data.emoji}
            <span class="item-count">
                ${item.count}
            </span>
        `;

        slot.title =
            `${data.name}\n클릭: 사용/장착\n더블클릭: 핫바 등록`;

        /*
         * 클릭:
         * 무기/갑옷 = 장착
         * 포션 = 사용
         */
        slot.onclick = () => {

            if(
                data.type === "weapon" ||
                data.type === "armor"
            ) {

                equipItem(item.id);

            }

            else if(
                data.type === "consumable"
            ) {

                useInventorySlot(index);

            }

        };

        /*
         * 더블클릭 = 아이템 핫바 등록.
         */
        slot.ondblclick = () => {

            assignItemToHotbar(index);

        };

        /*
         * 드래그 가능.
         */
        slot.draggable = true;

        slot.ondragstart = e => {

            e.dataTransfer.setData(
                "text/inventory-index",
                index
            );

        };

        slot.ondragover = e => {
            e.preventDefault();
        };

        slot.ondrop = e => {

            e.preventDefault();

            const from =
                Number(
                    e.dataTransfer.getData(
                        "text/inventory-index"
                    )
                );

            if(Number.isInteger(from))
                swapInventorySlots(
                    from,
                    index
                );

        };

        grid.appendChild(slot);

    }

    updateEquipmentUI();
    renderInventoryHotbar();

}


/* =========================================================
   INVENTORY USE
========================================================= */

function useInventorySlot(index) {

    const item =
        game.inventory[index];

    if(!item)
        return;

    const data =
        ITEMS[item.id];

    if(!data)
        return;

    if(
        data.type ===
        "consumable"
    ) {

        // HP가 가득 차 있으면 포션을 사용하지 않는다.
        if(
            item.id === "potion" &&
            game.player.hp >= game.player.maxHp
        ) {
            showDropNotification("🧪 HP가 가득 차 있어 포션을 사용할 수 없습니다.");
            return;
        }

        const restored =
            data.effect();

        // 실제로 회복된 경우에만 포션 1개를 소비한다.
        if(restored <= 0)
            return;

        removeFromInventory(
            item.id,
            1
        );

        showDropNotification(
            `${data.emoji} ${data.name} 사용 +${restored} HP`
        );

        updateUI();

    }

}


/* =========================================================
   INVENTORY SWAP
========================================================= */

function swapInventorySlots(a,b) {

    if(a === b)
        return;

    const temp =
        game.inventory[a];

    game.inventory[a] =
        game.inventory[b];

    game.inventory[b] =
        temp;

    /*
     * 핫바의 인벤 인덱스도 같이 이동.
     */
    for(let i=0;i<5;i++) {

        if(game.itemHotbar[i] === a) {

            game.itemHotbar[i] = b;

        }
        else if(game.itemHotbar[i] === b) {

            game.itemHotbar[i] = a;

        }

    }

    renderInventory();
    renderItemHotbar();

}

/* =========================================================
   ITEM HOTBAR
========================================================= */

function renderInventoryHotbar() {

    const container =
        document.getElementById(
            "inventory-hotbar"
        );

    if(!container)
        return;

    container.innerHTML = "";

    for(let i=0;i<5;i++) {

        const slot =
            document.createElement("div");

        slot.className =
            "hotbar-slot";

        slot.innerHTML =
            `<span class="hotbar-number">${i+1}</span>`;

        const inventoryIndex =
            game.itemHotbar[i];

        const item =
            Number.isInteger(inventoryIndex)
            ? game.inventory[inventoryIndex]
            : null;

        if(item && ITEMS[item.id]) {

            const data =
                ITEMS[item.id];

            slot.innerHTML +=
                `${data.emoji}
                 <span class="hotbar-count">
                    ${item.count}
                 </span>`;

            slot.title =
                `${data.name}\n클릭: 사용`;

        }
        else {

            slot.title =
                "빈 핫바 슬롯";

        }

        if(
            game.selectedItemHotbar === i
        ) {

            slot.classList.add(
                "selected"
            );

        }

        /*
         * 클릭 = 선택 + 사용
         */
        slot.onclick = () => {

            game.selectedItemHotbar = i;

            useItemHotbar();

            renderInventoryHotbar();
            renderItemHotbar();

        };

        /*
         * 인벤 슬롯을 이곳으로 드래그 가능.
         */
        slot.ondragover = e => {
            e.preventDefault();
        };

        slot.ondrop = e => {

            e.preventDefault();

            const index =
                Number(
                    e.dataTransfer.getData(
                        "text/inventory-index"
                    )
                );

            if(
                Number.isInteger(index) &&
                game.inventory[index]
            ) {

                game.itemHotbar[i] =
                    index;

                game.selectedItemHotbar = i;

                renderInventory();
                renderItemHotbar();

            }

        };

        /*
         * 우클릭 = 핫바 제거.
         */
        slot.oncontextmenu = e => {

            e.preventDefault();

            game.itemHotbar[i] = null;

            renderInventory();
            renderItemHotbar();

        };

        container.appendChild(slot);

    }

}


function renderItemHotbar() {

    const container =
        document.getElementById(
            "item-hotbar"
        );

    if(!container)
        return;

    container.innerHTML = "";

    for(let i=0;i<5;i++) {

        const slot =
            document.createElement("div");

        slot.className =
            "item-hud-slot";

        slot.innerHTML =
            `<span class="item-key">${i+1}</span>`;

        const inventoryIndex =
            game.itemHotbar[i];

        const item =
            Number.isInteger(inventoryIndex)
            ? game.inventory[inventoryIndex]
            : null;

        if(item && ITEMS[item.id]) {

            const data =
                ITEMS[item.id];

            slot.innerHTML +=
                `${data.emoji}
                 <span class="item-hud-count">
                    ${item.count}
                 </span>`;

            slot.title =
                `${data.name} 사용`;

        }

        if(
            game.selectedItemHotbar === i
        ) {

            slot.classList.add(
                "selected"
            );

        }

        slot.onclick = () => {

            game.selectedItemHotbar = i;

            useItemHotbar();

            renderItemHotbar();
            renderInventoryHotbar();

        };

        container.appendChild(slot);

    }

}


function assignItemToHotbar(index) {

    if(
        !game.inventory[index]
    )
        return;

    /*
     * 이미 등록되어 있으면 제거.
     */
    const existing =
        game.itemHotbar.indexOf(index);

    if(existing !== -1) {

        game.itemHotbar[existing] = null;

        showDropNotification(
            `${ITEMS[game.inventory[index].id].emoji} 핫바에서 제거`
        );

    }
    else {

        const empty =
            game.itemHotbar.indexOf(null);

        if(empty !== -1) {

            game.itemHotbar[empty] =
                index;

            game.selectedItemHotbar =
                empty;

        }
        else {

            game.itemHotbar[
                game.selectedItemHotbar
            ] = index;

        }

        const data =
            ITEMS[
                game.inventory[index].id
            ];

        showDropNotification(
            `${data.emoji} ${data.name} 핫바 등록`
        );

    }

    renderInventory();
    renderItemHotbar();

}


function useItemHotbar() {

    if(
        !gameStarted ||
        gameOver ||
        isPaused
    )
        return;

    const inventoryIndex =
        game.itemHotbar[
            game.selectedItemHotbar
        ];

    if(
        !Number.isInteger(
            inventoryIndex
        )
    )
        return;

    const item =
        game.inventory[inventoryIndex];

    if(!item)
        return;

    const data =
        ITEMS[item.id];

    if(!data)
        return;

    if(
        data.type ===
        "consumable"
    ) {

        useInventorySlot(
            inventoryIndex
        );

    }
    else if(
        data.type ===
        "weapon" ||
        data.type ===
        "armor"
    ) {

        equipItem(item.id);

    }

}

/* =========================================================
   SKILL COOLDOWN
========================================================= */

const skillLastUsed = {};


function skillReady(skillId) {

    const skill =
        SKILLS[skillId];

    if(!skill)
        return false;

    const last =
        skillLastUsed[skillId] || 0;

    return (
        performance.now() -
        last >=
        skill.cooldown
    );

}


function useSkillHotbar() {

    if(
        !gameStarted ||
        gameOver ||
        isPaused
    )
        return;

    const skillId =
        game.skillHotbar[
            game.selectedSkillHotbar
        ];

    if(
        !skillId ||
        skillId === "heal" ||
        !SKILLS[skillId]
    )
        return;

    useSkill(skillId);

}


function useSkill(skillId) {

    if(!SKILLS[skillId])
        return;

    if(!skillReady(skillId))
        return;

    skillLastUsed[skillId] =
        performance.now();

    switch(skillId) {

        case "multi":
            useMulti();
            break;

        case "ultimate":
            useUltimate();
            break;

        case "explosion":
            useExplosion();
            break;

        case "lightning":
            useLightning();
            break;

        case "dash":
            useDash();
            break;

        case "roll":
            useRoll();
            break;

    }

}


/* =========================================================
   MULTI
========================================================= */

function useMulti() {

    const angle =
        game.player.facingAngle;

    for(let i=-1;i<=1;i++) {

document.addEventListener(
    "keydown",
    function(e) {
        const code = e.code;
        const key = e.key.toLowerCase();
        const map = {
            KeyW:"w", KeyA:"a", KeyS:"s", KeyD:"d",
            KeyQ:"q", KeyE:"e", KeyR:"r", KeyT:"t", KeyF:"f",
            KeyM:"m", KeyK:"k", KeyI:"i",
            Digit1:"1", Digit2:"2", Digit3:"3", Digit4:"4", Digit5:"5",
            Escape:"escape", Space:" "
        };
        const gameKey = map[code] || key;
        if(["w","a","s","d","q","e","r","t","f","m","k","i","1","2","3","4","5","escape"," "].includes(gameKey) || ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(code)) e.preventDefault();
        game.keys[gameKey] = true;
        if(!gameStarted || e.repeat) return;
        if(gameKey === "i") return toggleInventory();
        if(gameKey === "k") return openSkillWindow();
        if(gameKey === "m") return toggleZoneSelect();
        if(gameKey >= "1" && gameKey <= "5") {
            game.selectedItemHotbar = Number(gameKey)-1;
            useItemHotbar(); renderItemHotbar(); renderInventoryHotbar(); return;
        }
        const skillKeyMap={q:0,e:1,r:2,t:3,f:4};
        if(Object.prototype.hasOwnProperty.call(skillKeyMap,gameKey)) {
            game.selectedSkillHotbar=skillKeyMap[gameKey]; useSkillHotbar(); renderSkillBar(); return;
        }
        if(gameKey === "escape") {
            const ids=["inventory","skill-window","shop","forge-panel","zone-select","map-window"];
            const open=ids.some(id=>document.getElementById(id)?.style.display === "block") || document.getElementById("structure-interact")?.style.display === "block";
            if(open) closeAllPanels(); else togglePause();
        }
    }
);

document.addEventListener(
    "keyup",
    function(e) {
        const map={KeyW:"w",KeyA:"a",KeyS:"s",KeyD:"d",KeyQ:"q",KeyE:"e",KeyR:"r",KeyT:"t",KeyF:"f",KeyM:"m",KeyK:"k",KeyI:"i",Digit1:"1",Digit2:"2",Digit3:"3",Digit4:"4",Digit5:"5",Escape:"escape",Space:" "};
        game.keys[map[e.code] || e.key.toLowerCase()] = false;
    }
);

/* =========================================================
   NORMAL ATTACK
========================================================= */

function playerAttack() {

    if(
        !gameStarted ||
        gameOver ||
        isPaused
    )
        return;

    const now =
        performance.now();

    const weapon =
        getEquippedWeapon();

    const cooldown =
        weapon
        ? weapon.cooldown
        : 500;

    if(
        now -
        game.player.lastAttack <
        cooldown
    )
        return;

    game.player.lastAttack = now;

    const angle =
        game.player.facingAngle;

    if(!weapon) {

        performMeleeAttack(
            55,
            1.2,
            game.player.damage,
            "fist",
            angle
        );

        return;

    }

    if(
        weapon.attackType ===
        "melee"
    ) {

        performMeleeAttack(
            weapon.range,
            weapon.arc,
            getTotalAttackDamage(),
            game.equipment.weapon,
            angle
        );

    }

    else if(
        weapon.attackType ===
        "magic"
    ) {

        fireMagicProjectile(
            angle,
            weapon
        );

    }

}


/* =========================================================
   MELEE
========================================================= */

function performMeleeAttack(
    range,
    arc,
    damage,
    type,
    angle
) {

    game.player.attackAnimation = {

        type:type,

        start:performance.now(),

        duration:
            type === "blessed_sword"
            ? 320
            : 250,

        angle:angle

    };

    for(const monster of [...game.monsters]) {

        const dx =
            monster.x -
            game.player.x;

        const dy =
            monster.y -
            game.player.y;

        const d =
            Math.hypot(dx,dy);

        if(
            d >
            range +
            monster.radius
        )
            continue;

        const monsterAngle =
            Math.atan2(dy,dx);

        const diff =
            normalizeAngle(
                monsterAngle -
                angle
            );

        if(
            Math.abs(diff) <=
            arc / 2
        ) {

            monster.hp -= damage;

            monster.attackFlash =
                performance.now() + 100;

            if(monster.hp <= 0)
                killMonster(monster);

        }

    }

}

   MAGIC PROJECTILE

function fireMagicProjectile(
    angle,
    weapon
) {

    const speed =
        weapon.projectileSpeed || 9;

    game.bullets.push({

        type:"magic",

        x:game.player.x,
        y:game.player.y,

        vx:Math.cos(angle) * speed,
        vy:Math.sin(angle) * speed,

        damage:getTotalAttackDamage(),

        radius:7,

        travelled:0,

        maxDistance:
            weapon.range || 700,

        color:"#d66bff"

    });

    game.player.attackAnimation = {

        type:"magic_staff",

        start:performance.now(),

        duration:180,

        angle:angle

    };

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer() {

    let dx = 0;
    let dy = 0;

    if(
        game.keys["w"] ||
        game.keys["arrowup"]
    )
        dy--;

    if(
        game.keys["s"] ||
        game.keys["arrowdown"]
    )
        dy++;

    if(
        game.keys["a"] ||
        game.keys["arrowleft"]
    )
        dx--;

    if(
        game.keys["d"] ||
        game.keys["arrowright"]
    )
        dx++;

    if(
        dx !== 0 ||
        dy !== 0
    ) {

        const len =
            Math.hypot(dx,dy);

        dx /= len;
        dy /= len;

        game.player.x +=
            dx * game.player.speed;

        game.player.y +=
            dy * game.player.speed;

        game.player.movementAnimation +=
            0.2;

    }

    game.player.x =
        clamp(
            game.player.x,
            game.player.radius,
            currentWorldSize -
            game.player.radius
        );

    game.player.y =
        clamp(
            game.player.y,
            game.player.radius,
            currentWorldSize -
            game.player.radius
        );

}

/* =========================================================
   MONSTER SPAWN
========================================================= */

function spawnMonster() {

    if(
        game.currentZone === "town"
    )
        return;

    if(
        game.monsters.length >= 25
    )
        return;

    const zone =
        ZONES[game.currentZone];

    if(!zone ||
       !zone.spawns.length)
        return;

    const type =
        zone.spawns[
            Math.floor(
                Math.random() *
                zone.spawns.length
            )
        ];

    const data =
        MONSTERS[type];

    const angle =
        Math.random() *
        Math.PI * 2;

    const spawnDistance =
        600 +
        Math.random() * 300;

    let x =
        game.player.x +
        Math.cos(angle) *
        spawnDistance;

    let y =
        game.player.y +
        Math.sin(angle) *
        spawnDistance;

    x =
        clamp(
            x,
            50,
            currentWorldSize - 50
        );

    y =
        clamp(
            y,
            50,
            currentWorldSize - 50
        );

    const level =
        game.player.level;

    const hpMultiplier =
        1 +
        Math.min(
            0.8,
            level * 0.08
        );

    const damageMultiplier =
        Math.min(
            0.70,
            0.45 +
            level * 0.01
        );

    game.monsters.push({

        type:type,

        x:x,
        y:y,

        radius:
            data.isElite
            ? 30
            : 22,

        hp:
            data.hp *
            hpMultiplier,

        maxHp:
            data.hp *
            hpMultiplier,

        damage:
            data.damage *
            damageMultiplier,

        speed:data.speed,

        exp:data.exp,

        color:data.color,

        emoji:data.emoji,

        vision:data.vision,

        attackRange:
            data.attackRange,

        loot:data.loot,

        isElite:
            data.isElite || false,

        lastAttack:0,

        attackCooldown:
            900 +
            Math.random() * 300,

        attackFlash:0

    });

}


/* =========================================================
   BULLETS
========================================================= */

function updateBullets() {

    for(
        let i=game.bullets.length-1;
        i>=0;
        i--
    ) {

        const bullet =
            game.bullets[i];

        bullet.x += bullet.vx;
        bullet.y += bullet.vy;

        bullet.travelled +=
            Math.hypot(
                bullet.vx,
                bullet.vy
            );

        if(
            bullet.travelled >
            bullet.maxDistance
        ) {

            game.bullets.splice(i,1);
            continue;

        }

        let hit = false;

        for(
            const monster of
            [...game.monsters]
        ) {

            const d =
                Math.hypot(
                    bullet.x -
                    monster.x,

                    bullet.y -
                    monster.y
                );

            if(
                d <=
                bullet.radius +
                monster.radius
            ) {

                monster.hp -=
                    bullet.damage;

                monster.attackFlash =
                    performance.now() + 100;

                hit = true;

                if(monster.hp <= 0)
                    killMonster(monster);

                break;

            }

        }

        if(hit) {

            game.bullets.splice(i,1);

        }

    }

}


/* =========================================================
   MONSTER AI
========================================================= */

function updateMonsters() {

    const now =
        performance.now();

    for(const monster of game.monsters) {

        const dx =
            game.player.x -
            monster.x;

        const dy =
            game.player.y -
            monster.y;

        const d =
            Math.hypot(dx,dy);

        if(
            d >
            monster.vision
        )
            continue;

        if(
            d >
            monster.attackRange +
            game.player.radius
        ) {

            if(d > 0) {

                monster.x +=
                    dx / d *
                    monster.speed;

                monster.y +=
                    dy / d *
                    monster.speed;

            }

        }
        else {

            if(
                now -
                monster.lastAttack >=
                monster.attackCooldown
            ) {

                monster.lastAttack =
                    now;

                if(
                    now <
                    game.player.invincibleUntil
                )
                    continue;

                const damage =
                    Math.max(
                        1,
                        monster.damage -
                        getDefense()
                    );

                game.player.hp -=
                    damage;

                monster.attackFlash =
                    now + 120;

                game.effects.push({

                    type:"playerHit",

                    x:game.player.x,
                    y:game.player.y,

                    start:now,
                    duration:200

                });

                if(
                    game.player.hp <= 0
                ) {

                    game.player.hp = 0;

                    triggerGameOver();

                    return;

                }

            }

        }

    }

}


/* =========================================================
   DROP
========================================================= */

function killMonster(monster) {

    const index =
        game.monsters.indexOf(monster);

    if(index === -1)
        return;

    game.monsters.splice(
        index,
        1
    );

    game.player.kills++;

    gainExp(monster.exp);

    dropMonsterLoot(monster);

}


/*
 * 몬스터 위치에 직접 아이템을 생성.
 */
function dropMonsterLoot(monster) {

    for(const loot of monster.loot) {

        if(
            Math.random() >
            loot.rate
        )
            continue;

        game.groundItems.push({

            id:loot.item,

            amount:
                loot.amount,

            x:
                monster.x +
                (Math.random()-0.5)*30,

            y:
                monster.y +
                (Math.random()-0.5)*30,

            bob:
                Math.random() *
                Math.PI * 2

        });

    }

}


function updateGroundItems() {

    for(
        let i=game.groundItems.length-1;
        i>=0;
        i--
    ) {

        const item =
            game.groundItems[i];

        item.bob += 0.05;

        const d =
            Math.hypot(
                item.x -
                game.player.x,

                item.y -
                game.player.y
            );

        if(d <= 42) {

            const picked =
                addToInventory(
                    item.id,
                    item.amount
                );

            if(picked) {

                const data =
                    ITEMS[item.id];

                showDropNotification(
                    `${data.emoji} ${data.name} +${item.amount}`
                );

                game.groundItems.splice(
                    i,
                    1
                );

            }

        }

    }

}


/* =========================================================
   EXP
========================================================= */

function gainExp(amount) {

    game.player.exp += amount;

    while(
        game.player.exp >=
        game.player.maxExp
    ) {

        game.player.exp -=
            game.player.maxExp;

        game.player.level++;

        game.player.maxExp =
            Math.round(
                game.player.maxExp * 1.25
            );

        game.player.maxHp += 10;

        game.player.hp =
            game.player.maxHp;

        game.player.damage += 2;

        showDropNotification(
            `🎉 LEVEL UP! LV.${game.player.level}`
        );

    }

    updateUI();

}

   STRUCTURES
========================================================= */

function checkNearbyStructure() {

    if(
        game.currentZone !== "town"
    ) {

        nearbyStructure = null;

        document.getElementById(
            "structure-interact"
        ).style.display = "none";

        return;

    }

    nearbyStructure = null;

    let closest =
        Infinity;

    for(
        const structure of STRUCTURES
    ) {

        const d =
            Math.hypot(
                game.player.x -
                structure.x,

                game.player.y -
                structure.y
            );

        if(
            d < 110 &&
            d < closest
        ) {

            closest = d;

            nearbyStructure =
                structure;

        }

    }

    const box =
        document.getElementById(
            "structure-interact"
        );

    const button =
        document.getElementById(
            "interact-button"
        );

    if(nearbyStructure) {

        box.style.display = "block";

        button.textContent =
            `${nearbyStructure.name} 열기`;

    }
    else {

        box.style.display = "none";

    }

}


function interactStructure() {

    if(!nearbyStructure)
        return;

    if(
        nearbyStructure.type ===
        "shop"
    ) {

        openShop();

    }

    else if(
        nearbyStructure.type ===
        "forge"
    ) {

        openForge();

    }

}

function openShop() {

    closeAllPanels();

    document.getElementById(
        "shop"
    ).style.display = "block";

    renderShop();

}


function renderShop() {

    const grid =
        document.getElementById(
            "shop-grid"
        );

    grid.innerHTML = "";

    const shopItems = [

        {
            id:"potion",
            price:50
        },

        {
            id:"sword",
            price:200
        },

        {
            id:"iron_armor",
            price:180
        },

        {
            id:"magic_staff",
            price:500
        },

        {
            id:"blessed_sword",
            price:5000
        }

    ];

    for(const shopItem of shopItems) {

        const data =
            ITEMS[shopItem.id];

        const div =
            document.createElement("div");

        div.className =
            "shop-item";

        div.innerHTML = `

            <div class="shop-item-name">
                ${data.emoji}
                ${data.name}
            </div>

            <div style="font-size:12px;color:#aaa;margin:4px 0;">
                ${getItemDescription(shopItem.id)}
            </div>

            <div class="shop-item-price">
                💰 ${shopItem.price}
            </div>

        `;

        div.onclick = () =>
            buyItem(
                shopItem.id,
                shopItem.price
            );

        grid.appendChild(div);

    }

}


function getItemDescription(id) {

    const item =
        ITEMS[id];

    if(
        item.type === "weapon"
    ) {

        if(
            item.attackType ===
            "melee"
        ) {

            return `
                공격력 +${item.damage}
                | 근접
            `;

        }

        return `
            공격력 +${item.damage}
            | 마법
            | 사거리 ${item.range}
        `;

    }

    if(
        item.type === "armor"
    ) {

        return `
            방어력 +${item.defense}
        `;

    }

    if(
        item.type === "consumable"
    ) {

        return "HP +50";

    }

    return "";

}


function buyItem(id,price) {

    if(
        game.player.gold <
        price
    ) {

        showDropNotification(
            "💰 금화가 부족합니다."
        );

        return;

    }

    /*
     * 인벤 공간을 먼저 확인.
     */
    if(
        id !== "gold" &&
        getInventoryIndex(id) === -1 &&
        getEmptyInventorySlot() === -1
    ) {

        showDropNotification(
            "🎒 인벤토리가 가득 찼습니다."
        );

        return;

    }

    game.player.gold -= price;

    /*
     * 골드 인벤 수치를 먼저 동기화.
     */
    syncGoldInventory();

    addToInventory(id,1);

    showDropNotification(
        `${ITEMS[id].emoji} ${ITEMS[id].name} 구매`
    );

    renderShop();
    updateUI();

}

function openForge() {

    document.getElementById(
        "forge-panel"
    ).style.display = "block";

    updateForgeUI();

}


function updateForgeUI() {

    const info =
        document.getElementById(
            "forge-info"
        );

    const weapon =
        getEquippedWeapon();

    const button =
        document.getElementById(
            "forge-upgrade-button"
        );

    if(!weapon) {

        info.innerHTML =
            "먼저 무기를 장착하세요.";

        button.disabled = true;

        return;

    }

    button.disabled = false;

    const level =
        getWeaponUpgradeLevel();

    const cost =
        100 + level * 75;

    const chance =
        Math.round(
            Math.max(
                45,
                90 -
                level * 2.5
            )
        );

    info.innerHTML = `

        <div style="font-size:25px;">
            ${weapon.emoji}
        </div>

        <strong>
            ${weapon.name}
        </strong>

        <br>

        강화:
        <span style="color:#ffa502;">
            +${level}
        </span>

        <br>

        공격력:
        <span style="color:#00f5ff;">
            ${getTotalAttackDamage()}
        </span>

        <br>

        비용:
        <span style="color:#ffd700;">
            💰 ${cost}
        </span>

        <br>

        성공 확률:
        <span style="color:#2ed573;">
            ${chance}%
        </span>

        <div style="font-size:11px;color:#aaa;margin-top:7px;">
            실패하면 강화 단계가 1 내려갑니다.
        </div>

    `;

}


function upgradeWeapon() {

    const weaponId =
        game.equipment.weapon;

    if(!weaponId) {

        showDropNotification(
            "무기를 장착하세요."
        );

        return;

    }

    const level =
        game.weaponUpgrade[weaponId] || 0;

    if(level >= 20) {

        showDropNotification(
            "최대 강화입니다."
        );

        return;

    }

    const cost =
        100 + level * 75;

    if(
        game.player.gold <
        cost
    ) {

        showDropNotification(
            "💰 금화가 부족합니다."
        );

        return;

    }

    game.player.gold -= cost;

    syncGoldInventory();

    const chance =
        Math.max(
            0.45,
            0.90 -
            level * 0.025
        );

    if(
        Math.random() <
        chance
    ) {

        game.weaponUpgrade[weaponId] =
            level + 1;

        showDropNotification(
            `✨ 강화 성공! +${level+1}`
        );

    }
    else {

        game.weaponUpgrade[weaponId] =
            Math.max(
                0,
                level - 1
            );

        showDropNotification(
            `💥 강화 실패! +${Math.max(0,level-1)}`
        );

    }

    updateForgeUI();
    renderInventory();
    updateUI();

}


/* =========================================================
   ZONE
========================================================= */

function initZoneSelect() {

    const container =
        document.getElementById(
            "zone-buttons"
        );

    container.innerHTML = "";

    for(const key in ZONES) {

        const zone =
            ZONES[key];

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "zone-btn";

        if(
            key === game.currentZone
        ) {

            button.classList.add(
                "active"
            );

        }

        button.textContent =
            zone.name;

        button.onclick = e => {
            e.stopPropagation();
            changeZone(key);
        };

        container.appendChild(
            button
        );

    }

}


function toggleZoneSelect() {

    if(
        !gameStarted ||
        gameOver
    )
        return;

    const panel =
        document.getElementById(
            "zone-select"
        );

    if(
        panel.style.display ===
        "block"
    ) {

        panel.style.display =
            "none";

    }
    else {

        closeAllPanels();

        panel.style.display =
            "block";

    }

}


function changeZone(key) {

    if(
        !ZONES[key] ||
        !gameStarted ||
        gameOver
    )
        return;

    const zone =
        ZONES[key];

    // 지역을 바꾸기 전에 현재 지역의 이동/전투 상태를 정리한다.
    game.currentZone = key;

    currentWorldSize =
        zone.worldSize;

    game.player.x =
        clamp(
            zone.x,
            game.player.radius,
            currentWorldSize - game.player.radius
        );

    game.player.y =
        clamp(
            zone.y,
            game.player.radius,
            currentWorldSize - game.player.radius
        );

    game.monsters = [];
    game.bullets = [];
    game.groundItems = [];
    game.effects = [];
    nearbyStructure = null;

    // 이전 지역의 카메라 위치가 새 지역에 남아 화면이 밀리는 문제 방지.
    updateCamera();
    lastSpawnTime = performance.now();

    document.getElementById(
        "zone-select"
    ).style.display = "none";

    initZoneSelect();
    updateUI();

}


/* =========================================================
   EFFECTS
========================================================= */

function updateEffects() {

    const now =
        performance.now();

    game.effects =
        game.effects.filter(
            effect =>
                now -
                effect.start <
                effect.duration
        );

}


function drawEffects() {

    const now =
        performance.now();

    for(
        const effect of game.effects
    ) {

        const progress =
            clamp(
                (now-effect.start) /
                effect.duration,
                0,
                1
            );

        ctx.save();

        if(
            effect.type ===
            "explosion"
        ) {

            const radius =
                40 +
                progress * 210;

            ctx.globalAlpha =
                1-progress;

            ctx.strokeStyle =
                "#ff8c00";

            ctx.lineWidth = 12;

            ctx.beginPath();

            ctx.arc(
                effect.x,
                effect.y,
                radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.strokeStyle =
                "#ffff00";

            ctx.lineWidth = 4;

            ctx.beginPath();

            ctx.arc(
                effect.x,
                effect.y,
                radius * 0.7,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }

        else if(
            effect.type ===
            "ultimate"
        ) {

            const radius =
                30 +
                progress * 300;

            ctx.globalAlpha =
                1-progress;

            ctx.strokeStyle =
                "#d66bff";

            ctx.lineWidth = 15;

            ctx.beginPath();

            ctx.arc(
                effect.x,
                effect.y,
                radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth = 4;

            ctx.beginPath();

            ctx.arc(
                effect.x,
                effect.y,
                radius * 0.65,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }


        else if(
            effect.type ===
            "lightning"
        ) {

            ctx.globalAlpha =
                1-progress;

            ctx.strokeStyle =
                "#fff";

            ctx.lineWidth = 8;

            ctx.beginPath();

            ctx.moveTo(
                effect.x,
                effect.y -
                180
            );

            ctx.lineTo(
                effect.x - 15,
                effect.y - 110
            );

            ctx.lineTo(
                effect.x + 15,
                effect.y - 65
            );

            ctx.lineTo(
                effect.x,
                effect.y
            );

            ctx.stroke();

            ctx.strokeStyle =
                "#00f5ff";

            ctx.lineWidth = 3;

            ctx.stroke();

        }

        else if(
            effect.type ===
            "dash"
        ) {

            ctx.globalAlpha =
                1-progress;

            ctx.strokeStyle =
                "#00f5ff";

            ctx.lineWidth = 7;

            ctx.beginPath();

            ctx.moveTo(
                effect.x,
                effect.y
            );

            ctx.lineTo(
                effect.targetX,
                effect.targetY
            );

            ctx.stroke();

            ctx.beginPath();

            ctx.arc(
                effect.targetX,
                effect.targetY,
                25 +
                progress * 35,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }

        else if(
            effect.type ===
            "roll"
        ) {

            ctx.globalAlpha =
                1-progress;

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth = 5;

            ctx.beginPath();

            ctx.moveTo(
                effect.x,
                effect.y
            );

            ctx.lineTo(
                effect.targetX,
                effect.targetY
            );

            ctx.stroke();

            ctx.beginPath();

            ctx.arc(
                effect.targetX,
                effect.targetY,
                20 +
                progress * 20,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }

        else if(
            effect.type ===
            "playerHit"
        ) {

            ctx.globalAlpha =
                1-progress;

            ctx.strokeStyle =
                "#ff4757";

            ctx.lineWidth = 5;

            ctx.beginPath();

            ctx.arc(
                effect.x,
                effect.y,
                30,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }

        ctx.restore();

    }

}


/* =========================================================
   UPDATE
========================================================= */

function updateLogic() {

    if(
        !gameStarted ||
        gameOver ||
        isPaused
    )
        return;

    updatePlayer();

    updateCamera();

    checkNearbyStructure();

    updateBullets();

    updateMonsters();

    updateGroundItems();

    updateEffects();

    const now =
        performance.now();

    // 자동 회복: 전투 중에도 1초마다 HP 2 회복.
    // 최대 HP를 넘지 않으며, 이미 풀피라면 아무 일도 하지 않는다.
    if(
        now - lastRegenTime >= 1000
    ) {
        if(game.player.hp > 0 && game.player.hp < game.player.maxHp) {
            game.player.hp = Math.min(
                game.player.maxHp,
                game.player.hp + 2
            );
        }
        lastRegenTime = now;
    }

    if(
        game.currentZone !== "town" &&
        now -
        lastSpawnTime >
        1800
    ) {

        spawnMonster();

        lastSpawnTime = now;

    }

}

/* =========================================================
   COOLDOWN UI
========================================================= */

function updateSkillCooldowns() {

    const now =
        performance.now();

    for(let i=0;i<5;i++) {

        const skillId =
            game.skillHotbar[i];

        const overlay =
            document.getElementById(
                `skill-cooldown-${i}`
            );

        if(!overlay)
            continue;

        if(
            !skillId ||
            !SKILLS[skillId]
        ) {

            overlay.style.height =
                "0%";

            continue;

        }

        const skill =
            SKILLS[skillId];

        const last =
            skillLastUsed[skillId] || 0;

        const elapsed =
            now - last;

        const remain =
            Math.max(
                0,
                skill.cooldown -
                elapsed
            );

        const percent =
            remain /
            skill.cooldown *
            100;

        overlay.style.height =
            `${percent}%`;

    }

}
