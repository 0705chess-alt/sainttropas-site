/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld() {

    const zone =
        ZONES[game.currentZone];

    ctx.fillStyle =
        zone.color;

    ctx.fillRect(
        0,
        0,
        currentWorldSize,
        currentWorldSize
    );

    ctx.strokeStyle =
        "rgba(255,255,255,0.04)";

    ctx.lineWidth = 1;

    for(
        let x=0;
        x<=currentWorldSize;
        x+=100
    ) {

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
            x,
            currentWorldSize
        );

        ctx.stroke();

    }

    for(
        let y=0;
        y<=currentWorldSize;
        y+=100
    ) {

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(
            currentWorldSize,
            y
        );

        ctx.stroke();

    }

}


/* =========================================================
   STRUCTURES DRAW
========================================================= */

function drawStructures() {

    if(
        game.currentZone !== "town"
    )
        return;

    for(
        const structure of STRUCTURES
    ) {

        ctx.fillStyle =
            structure.color;

        ctx.fillRect(
            structure.x -
            structure.size/2,

            structure.y -
            structure.size/2,

            structure.size,
            structure.size
        );

        ctx.strokeStyle =
            nearbyStructure === structure
            ? "#00f5ff"
            : "#222";

        ctx.lineWidth =
            nearbyStructure === structure
            ? 4
            : 2;

        ctx.strokeRect(
            structure.x -
            structure.size/2,

            structure.y -
            structure.size/2,

            structure.size,
            structure.size
        );

        ctx.textAlign = "center";
        ctx.font = "20px Arial";

        ctx.fillStyle = "#fff";

        ctx.fillText(
            structure.name.split(" ")[0],
            structure.x,
            structure.y + 7
        );

    }

}


/* =========================================================
   GROUND ITEMS DRAW
========================================================= */

function drawGroundItems() {

    for(
        const item of game.groundItems
    ) {

        const data =
            ITEMS[item.id];

        if(!data)
            continue;

        const bob =
            Math.sin(item.bob) * 4;

        ctx.save();

        ctx.shadowColor =
            "#00f5ff";

        ctx.shadowBlur = 8;

        ctx.font = "25px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            data.emoji,
            item.x,
            item.y + bob
        );

        ctx.restore();

    }

}


/* =========================================================
   BULLETS DRAW
========================================================= */

function drawBullets() {

    for(
        const bullet of game.bullets
    ) {

        ctx.save();

        ctx.fillStyle =
            bullet.color ||
            "#fff";

        ctx.shadowColor =
            bullet.color ||
            "#fff";

        ctx.shadowBlur = 12;

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    }

}


/* =========================================================
   MONSTER DRAW
========================================================= */

function drawMonsters() {

    for(
        const monster of game.monsters
    ) {

        ctx.textAlign = "center";

        ctx.font =
            monster.isElite
            ? "36px Arial"
            : "28px Arial";

        ctx.fillText(
            monster.emoji,
            monster.x,
            monster.y + 10
        );

        const barWidth =
            monster.isElite
            ? 65
            : 45;

        const hp =
            clamp(
                monster.hp /
                monster.maxHp,
                0,
                1
            );

        ctx.fillStyle = "#222";

        ctx.fillRect(
            monster.x -
            barWidth/2,

            monster.y -
            monster.radius -
            14,

            barWidth,
            5
        );

        ctx.fillStyle =
            "#ff4757";

        ctx.fillRect(
            monster.x -
            barWidth/2,

            monster.y -
            monster.radius -
            14,

            barWidth * hp,
            5
        );

        if(
            monster.attackFlash >
            performance.now()
        ) {

            ctx.strokeStyle =
                "#fff";

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.arc(
                monster.x,
                monster.y,
                monster.radius + 5,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }

    }

}


/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer() {

    const p =
        game.player;

    ctx.save();

    if(
        performance.now() <
        p.invincibleUntil
    ) {

        ctx.globalAlpha =
            0.55 +
            Math.sin(
                performance.now()/40
            ) * 0.3;

    }

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        p.radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#00f5ff";

    ctx.fill();

    ctx.strokeStyle =
        "#fff";

    ctx.lineWidth = 2;

    ctx.stroke();

    ctx.restore();

    drawWeapon();

    drawAttackAnimation();

}


/* =========================================================
   WEAPON DRAW
========================================================= */

function drawWeapon() {

    const weapon =
        getEquippedWeapon();

    if(!weapon)
        return;

    const p =
        game.player;

    const angle =
        p.facingAngle;

    const handX =
        p.x +
        Math.cos(angle)*10;

    const handY =
        p.y +
        Math.sin(angle)*10;


    if(
        weapon.attackType ===
        "melee"
    ) {

        const length =
            game.equipment.weapon ===
            "blessed_sword"
            ? 45
            : 37;

        const endX =
            handX +
            Math.cos(angle) *
            length;

        const endY =
            handY +
            Math.sin(angle) *
            length;

        ctx.strokeStyle =
            game.equipment.weapon ===
            "blessed_sword"
            ? "#ffe66d"
            : "#ddd";

        ctx.lineWidth =
            game.equipment.weapon ===
            "blessed_sword"
            ? 7
            : 6;

        ctx.beginPath();

        ctx.moveTo(
            handX,
            handY
        );

        ctx.lineTo(
            endX,
            endY
        );

        ctx.stroke();

        ctx.strokeStyle =
            "#7b4f2c";

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.moveTo(
            handX -
            Math.cos(angle)*5,

            handY -
            Math.sin(angle)*5
        );

        ctx.lineTo(
            handX +
            Math.cos(angle)*7,

            handY +
            Math.sin(angle)*7
        );

        ctx.stroke();

    }

    else if(
        weapon.attackType ===
        "magic"
    ) {

        const endX =
            handX +
            Math.cos(angle)*30;

        const endY =
            handY +
            Math.sin(angle)*30;

        ctx.strokeStyle =
            "#d66bff";

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(
            handX,
            handY
        );

        ctx.lineTo(
            endX,
            endY
        );

        ctx.stroke();

        ctx.fillStyle =
            "#fff";

        ctx.beginPath();

        ctx.arc(
            endX,
            endY,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================================================
   ATTACK ANIMATION
========================================================= */

function drawAttackAnimation() {

    const animation =
        game.player.attackAnimation;

    if(!animation.type)
        return;

    const now =
        performance.now();

    const progress =
        (now -
        animation.start) /
        animation.duration;

    if(progress >= 1) {

        animation.type = null;

        return;

    }

    const p =
        game.player;


    if(
        animation.type ===
        "sword" ||
        animation.type ===
        "blessed_sword"
    ) {

        const weapon =
            getEquippedWeapon();

        if(!weapon)
            return;

        ctx.save();

        ctx.globalAlpha =
            1-progress;

        ctx.strokeStyle =
            animation.type ===
            "blessed_sword"
            ? "#ffe66d"
            : "#fff";

        ctx.lineWidth =
            animation.type ===
            "blessed_sword"
            ? 10
            : 7;

        const radius =
            weapon.range;

        const start =
            animation.angle -
            weapon.arc/2 +
            progress *
            weapon.arc;

        const end =
            start +
            weapon.arc * 0.6;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            start,
            end
        );

        ctx.stroke();

        ctx.restore();

    }

    else if(
        animation.type ===
        "fist"
    ) {

        ctx.save();

        ctx.globalAlpha =
            1-progress;

        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            55,
            animation.angle-0.6,
            animation.angle+0.6
        );

        ctx.stroke();

        ctx.restore();

    }

    else if(
        animation.type ===
        "magic_staff"
    ) {

        ctx.save();

        ctx.globalAlpha =
            1-progress;

        ctx.strokeStyle =
            "#d66bff";

        ctx.lineWidth = 6;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            32,
            animation.angle-0.3,
            animation.angle+0.3
        );

        ctx.stroke();

        ctx.restore();

    }

    else if(
        animation.type ===
        "multi"
    ) {

        ctx.save();

        ctx.globalAlpha =
            1-progress;

        ctx.strokeStyle =
            "#00f5ff";

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            40 +
            progress*25,
            animation.angle-0.6,
            animation.angle+0.6
        );

        ctx.stroke();

        ctx.restore();

    }

}


/* =========================================================
   CROSSHAIR
========================================================= */

function drawCrosshair() {

    const x =
        game.mouse.x;

    const y =
        game.mouse.y;

    ctx.strokeStyle =
        "rgba(255,255,255,0.7)";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(x-8,y);
    ctx.lineTo(x+8,y);

    ctx.moveTo(x,y-8);
    ctx.lineTo(x,y+8);

    ctx.stroke();

}


/* =========================================================
   MINIMAP
========================================================= */

function drawMinimap() {

    mCtx.clearRect(
        0,
        0,
        mCanvas.width,
        mCanvas.height
    );

    const scale =
        mCanvas.width /
        currentWorldSize;

    mCtx.fillStyle =
        ZONES[game.currentZone].color;

    mCtx.fillRect(
        0,
        0,
        mCanvas.width,
        mCanvas.height
    );


    if(
        game.currentZone === "town"
    ) {

        for(
            const structure of STRUCTURES
        ) {

            mCtx.fillStyle =
                structure.color;

            mCtx.fillRect(
                structure.x*scale-3,
                structure.y*scale-3,
                6,
                6
            );

        }

    }


    for(
        const monster of game.monsters
    ) {

        mCtx.fillStyle =
            "#ff4757";

        mCtx.beginPath();

        mCtx.arc(
            monster.x*scale,
            monster.y*scale,
            monster.isElite
            ? 3
            : 2,
            0,
            Math.PI*2
        );

        mCtx.fill();

    }


    for(
        const item of game.groundItems
    ) {

        mCtx.fillStyle =
            "#ffa502";

        mCtx.fillRect(
            item.x*scale-2,
            item.y*scale-2,
            4,
            4
        );

    }


    mCtx.fillStyle =
        "#00f5ff";

    mCtx.beginPath();

    mCtx.arc(
        game.player.x*scale,
        game.player.y*scale,
        4,
        0,
        Math.PI*2
    );

    mCtx.fill();

}


/* =========================================================
   BIG MAP
========================================================= */

function drawBigMap() {

    const rect =
        bigMap.getBoundingClientRect();

    bigMap.width =
        Math.max(
            500,
            Math.floor(rect.width)
        );

    bigMap.height =
        Math.max(
            400,
            Math.floor(rect.height)
        );

    const w =
        bigMap.width;

    const h =
        bigMap.height;

    bigMapCtx.clearRect(
        0,
        0,
        w,
        h
    );

    /*
     * 전체 세계를 4000 x 4000 기준으로 표시.
     */
    bigMapCtx.fillStyle =
        "#111";

    bigMapCtx.fillRect(
        0,
        0,
        w,
        h
    );

    for(const key in ZONES) {

        const zone =
            ZONES[key];

        const x =
            zone.x /
            WORLD_SIZE_NORMAL *
            w;

        const y =
            zone.y /
            WORLD_SIZE_NORMAL *
            h;

        bigMapCtx.fillStyle =
            zone.color;

        bigMapCtx.globalAlpha =
            0.85;

        bigMapCtx.fillRect(
            x-70,
            y-55,
            140,
            110
        );

        bigMapCtx.globalAlpha =
            1;

        bigMapCtx.strokeStyle =
            key === game.currentZone
            ? "#00f5ff"
            : "#555";

        bigMapCtx.lineWidth =
            key === game.currentZone
            ? 4
            : 2;

        bigMapCtx.strokeRect(
            x-70,
            y-55,
            140,
            110
        );

        bigMapCtx.fillStyle =
            "#fff";

        bigMapCtx.font =
            "14px Arial";

        bigMapCtx.textAlign =
            "center";

        bigMapCtx.fillText(
            zone.name,
            x,
            y
        );

    }

    /*
     * 현재 플레이어 위치.
     */
    const px =
        game.player.x /
        currentWorldSize *
        w;

    const py =
        game.player.y /
        currentWorldSize *
        h;

    bigMapCtx.fillStyle =
        "#00f5ff";

    bigMapCtx.shadowColor =
        "#00f5ff";

    bigMapCtx.shadowBlur =
        15;

    bigMapCtx.beginPath();

    bigMapCtx.arc(
        px,
        py,
        8,
        0,
        Math.PI*2
    );

    bigMapCtx.fill();

    bigMapCtx.shadowBlur = 0;

}


/* =========================================================
   DRAW GAME
========================================================= */

function drawGame() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        -game.camera.x,
        -game.camera.y
    );

    drawWorld();

    drawStructures();

    drawGroundItems();

    drawBullets();

    drawMonsters();

    drawEffects();

    drawPlayer();

    ctx.restore();

    drawCrosshair();

    drawMinimap();

    updateUI();

}


/* =========================================================
   MAIN LOOP
========================================================= */

function gameLoop() {

    updateLogic();

    if(gameStarted) {

        drawGame();

    }

    requestAnimationFrame(
        gameLoop
    );

}

gameLoop();

</script>
