<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검 강화 게임 - 전설의 대장장이</title>
<style>
  :root{
    --bg-deep: #14100c;
    --bg-panel: #1f1811;
    --ember: #ff7a3d;
    --gold: #e8b84b;
    --danger: #c23b3b;
    --safe: #4a9d6e;
    --text: #ede4d3;
    --text-dim: #a89a82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% 20%, #2a1c10 0%, var(--bg-deep) 55%),
      var(--bg-deep);
    color: var(--text);
    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    touch-action: manipulation;
  }
  .stage { width: 100%; max-width: 480px; }
  h1 {
    font-size: 22px;
    text-align: center;
    letter-spacing: 4px;
    color: var(--ember);
    margin: 0 0 4px;
    text-shadow: 0 0 18px rgba(255,122,61,0.5);
  }
  .sub { text-align: center; color: var(--text-dim); font-size: 12px; margin-bottom: 20px; letter-spacing: 2px; }
  .topbar {
    display: flex;
    justify-content: space-between;
    background: var(--bg-panel);
    border: 1px solid #3a2c1c;
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .topbar .gold { color: var(--gold); font-weight: bold; }
  .forge {
    background: radial-gradient(ellipse at 50% 30%, #2e1c10 0%, var(--bg-panel) 70%);
    border: 1px solid #3a2c1c;
    border-radius: 14px;
    padding: 30px 16px 20px;
    text-align: center;
    position: relative;
    min-height: 330px;
  }
  .level-badge { font-size: 30px; font-weight: 900; letter-spacing: 1px; margin-bottom: 6px; transition: color 0.3s; }
  .tier-label { font-size: 11px; letter-spacing: 3px; color: var(--text-dim); margin-bottom: 10px; }
  .tier-track { font-size: 10px; color: var(--text-dim); margin-bottom: 14px; }
  #swordWrap { height: 200px; display: flex; align-items: flex-end; justify-content: center; position: relative; }
  #swordSvg { width: 130px; height: 200px; transition: filter 0.3s, transform 0.4s ease; overflow: visible; }
  #swordSvg.level-up-pulse { animation: levelPulse 0.55s ease; }
  @keyframes levelPulse {
    0% { transform: scale(1); }
    35% { transform: scale(1.25) rotate(-4deg); }
    60% { transform: scale(0.95) rotate(3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  #swordSvg.shatter { animation: shatterShake 0.5s ease; }
  @keyframes shatterShake {
    0%,100% { transform: scale(1) translateX(0); }
    20% { transform: scale(0.9) translateX(-8px) rotate(-6deg); }
    40% { transform: scale(0.9) translateX(8px) rotate(6deg); }
    60% { transform: scale(0.85) translateX(-5px) rotate(-3deg); }
    80% { transform: scale(0.95) translateX(5px) rotate(2deg); }
  }
  .flame { animation: flicker 0.6s ease-in-out infinite alternate; transform-origin: 50px 30px; }
  .flame.f2 { animation-delay: 0.15s; }
  .flame.f3 { animation-delay: 0.3s; }
  @keyframes flicker {
    from { transform: scaleY(1) translateY(0); opacity: 0.85; }
    to { transform: scaleY(1.18) translateY(-3px); opacity: 1; }
  }
  #aura { animation: auraPulse 2.2s ease-in-out infinite; transform-origin: 50px 80px; }
  @keyframes auraPulse {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(1.1); }
  }
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    left: 50%; top: 46%;
    animation: particleFly 0.75s ease-out forwards;
  }
  @keyframes particleFly { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
  .float-text {
    position: absolute;
    left: 50%; top: 40%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: 900;
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
    text-shadow: 0 0 10px rgba(0,0,0,0.6);
    white-space: nowrap;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
    20% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -55px) scale(1); }
  }
  .stats {
    display: flex; justify-content: center; gap: 18px;
    margin-top: 10px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap;
  }
  .stats b { color: var(--text); }
  .action-row { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  .btn-pair { display: flex; gap: 10px; }
  .btn-pair button { flex: 1; }
  button {
    font-family: inherit; border: none; border-radius: 8px; padding: 13px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: transform 0.08s, filter 0.15s; letter-spacing: 1px;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-enhance { background: linear-gradient(135deg, var(--ember), #d9531f); color: #1a0d05; box-shadow: 0 0 20px rgba(255,122,61,0.35); }
  .btn-enhance:hover:not(:disabled) { filter: brightness(1.1); }
  .btn-hunt { background: var(--bg-panel); border: 1px solid #4a3a26 !important; color: var(--text); font-size: 13px; }
  .btn-hunt:hover:not(:disabled) { filter: brightness(1.3); }
  .btn-sell { background: var(--bg-panel); border: 1px solid #5a4326 !important; color: var(--gold); font-size: 13px; }
  .btn-sell:hover:not(:disabled) { filter: brightness(1.3); }
  .btn-scroll { background: var(--bg-panel); border: 1px solid #305a44 !important; color: var(--safe); font-size: 12px; padding: 10px; }
  .risk-note { font-size: 11px; color: var(--danger); margin-top: 4px; min-height: 14px; text-align: center;}
  .risk-note.protected { color: var(--safe); }
  .log {
    margin-top: 18px; background: var(--bg-panel); border: 1px solid #3a2c1c; border-radius: 10px;
    padding: 10px 14px; height: 110px; overflow-y: auto; font-size: 12px; color: var(--text-dim);
    display: flex; flex-direction: column-reverse;
  }
  .log div { padding: 3px 0; border-bottom: 1px solid #2a2117; }
  .log .success { color: var(--safe); }
  .log .fail { color: var(--danger); }
  .log .info { color: var(--gold); }
  .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; border-radius: 14px; }
  .flash.success { background: radial-gradient(circle, rgba(232,184,75,0.35), transparent 70%); animation: pulse 0.5s ease-out; }
  .flash.fail { background: radial-gradient(circle, rgba(194,59,59,0.4), transparent 70%); animation: pulse 0.5s ease-out; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0; } }
  .shake { animation: shake 0.35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }
  
  /* 신규 수집/도감 탭 시스템 */
  .tabs { display: flex; gap: 8px; margin-top: 20px; }
  .tab-btn { flex: 1; background: #261e15; border: 1px solid #3a2c1c; color: var(--text-dim); padding: 8px; font-size: 12px; border-radius: 6px; }
  .tab-btn.active { background: var(--bg-panel); color: var(--gold); border-color: var(--gold); }
  .tab-content { display: none; margin-top: 12px; }
  .tab-content.active { display: block; }

  /* 사냥터 스타일 완결 */
  .hunt-zone {
    background: radial-gradient(ellipse at 50% 30%, #1c2410 0%, var(--bg-panel) 70%);
    border: 1px solid #2c3a1c; border-radius: 14px; padding: 18px 16px 16px; text-align: center; position: relative; overflow: hidden;
  }
  .hunt-zone.boss { border-color: var(--gold); box-shadow: 0 0 24px rgba(232,184,75,0.45); }
  .monster-name { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 4px; }
  .monster-emoji { font-size: 56px; line-height: 1; display: inline-block; animation: idleBounce 2s ease-in-out infinite; user-select: none;}
  .monster-emoji.hit { animation: hitShake 0.25s; }
  @keyframes idleBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes hitShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .hp-bar-track { width: 100%; height: 10px; background: #241a10; border-radius: 6px; overflow: hidden; margin-top: 12px; border: 1px solid #3a2c1c; }
  .hp-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff7a3d, #c23b3b); transition: width 0.15s ease; }
  .hp-text { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  /* 상점 & 도감 스타일 */
  .shop-grid, .book-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .shop-card, .book-card { background: var(--bg-panel); border: 1px solid #3a2c1c; padding: 12px; border-radius: 8px; text-align: center; }
  .shop-card p, .book-card p { margin: 4px 0; font-size: 12px; }
  .shop-card b { color: var(--gold); }
  .book-card.locked { opacity: 0.4; filter: grayscale(1); }
  .book-card.unlocked { border-color: var(--gold); background: linear-gradient(135deg, #2b2216, var(--bg-panel)); }
</style>
</head>
<body>

<div class="stage">
  <h1>대장간 검 강화</h1>
  <div class="sub">FORGE SIMULATOR</div>

  <!-- 최상단 스탯바 -->
  <div class="topbar">
    <div>보유 골드: <span class="gold" id="userGold">5,000</span> G</div>
    <div>전투력: <b id="userAtk" style="color:var(--ember)">10</b></div>
  </div>

  <!-- 대장간 메인 창 -->
  <div class="forge" id="forgePanel">
    <div class="flash" id="flashEff"></div>
    <div class="level-badge" id="swordLvl">+0</div>
    <div class="tier-label" id="swordName">평범한 훈련용 연습검</div>
    <div class="tier-track" id="chanceInfo">강화 확률: 100% | 비용: 100G</div>
    
    <div id="swordWrap">
      <!-- 기본 검 이미지 (SVG 형태 유지) -->
      <svg id="swordSvg" viewBox="0 0 100 200">
        <g id="aura" fill="none" stroke="rgba(232,184,75,0.4)" stroke-width="2">
          <circle cx="50" cy="80" r="30" stroke-dasharray="4 4"/>
        </g>
        <!-- 검 자루 -->
